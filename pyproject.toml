[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphmerge"
version = "0.1.0"
description = "Parallel AI Agent Collaboration via Graph-Structured Distributed Block Optimization (arXiv:2610.30074)"
readme = "README.md"
license = { text = "Apache-2.0" }
keywords = [
    "mcp-server",
    "ai-agents",
    "ast-analysis",
    "mwis",
    "multi-agent",
    "code-merging",
    "tree-sitter",
    "claude-code",
    "langgraph",
]
authors = [
    { name = "GraphMerge Contributors" }
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Compilers",
]
dependencies = [
    "langgraph>=0.2.30,<2",
    "langchain-core>=0.3.0,<2",
    "networkx>=3.3,<4",
    "tree-sitter>=0.22.0,<1",
    "tree-sitter-python>=0.21.0,<1",
    "pydantic>=2.8.0,<3",
    "pulp>=2.8.0,<5",
    "mcp>=1.0.0,<3",
    "psutil>=5.9.0,<7",
]

[project.optional-dependencies]
languages = [
    "tree-sitter-javascript>=0.23.0,<1",
    "tree-sitter-typescript>=0.23.0,<1",
    "tree-sitter-go>=0.23.0,<1",
    "tree-sitter-rust>=0.23.0,<1",
    "tree-sitter-java>=0.23.0,<1",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "docker>=7.1.0",
    "ruff>=0.5.0",
    "black>=24.4.0",
    "tree-sitter-javascript>=0.23.0,<1",
    "tree-sitter-typescript>=0.23.0,<1",
    "tree-sitter-go>=0.23.0,<1",
    "tree-sitter-rust>=0.23.0,<1",
    "tree-sitter-java>=0.23.0,<1",
]

[project.scripts]
graphmerge = "graphmerge.cli:main"
graphmerge-mcp = "graphmerge.mcp_server:main"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.black]
target-version = ["py310"]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "strict"
